services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny
    ports:
      # Host-side port only (for optional local psql/debugging access — the
      # backend always talks to db:5432 over the compose network regardless).
      # Mapped off the default 5432 since many dev machines already run a
      # local Postgres there.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # No host port mapping: the backend and ollama-init reach this over the
    # internal compose network as `ollama:11434`, and exposing 11434 on the
    # host risks colliding with a native Ollama install already using it.
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The ollama/ollama image has no curl/wget — `ollama list` hits the same
      # local API and fails cleanly if the server isn't up yet.
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: >
      sh -c "ollama pull $$OLLAMA_MODEL && ollama pull $$OLLAMA_EMBED_MODEL"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny@db:5432/lenny
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3400:3400"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # Waits for the model pull to actually finish (exit 0), not just for
      # the ollama server to be up — `docker compose up backend` alone is
      # then genuinely self-contained instead of racing chat/embed calls
      # against a still-downloading model.
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3400/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3400}
    ports:
      - "3500:3500"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
